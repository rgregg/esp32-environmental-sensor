[platformio]
default_envs = esp32-poe-iso

[env:esp32-poe-iso]
platform = espressif32
board = esp32-poe-iso
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit CCS811 Library@^1.1.3
    knolleary/PubSubClient@^2.8
    ESP32Async/ESPAsyncWebServer@^3.6.0
    ESP32Async/AsyncTCP@^3.3.2

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++17
    -I include
    -DUNITY_INCLUDE_DOUBLE
; Only the framework-agnostic sources compile on the host. Arduino-only
; sources (net.cpp, sensors, publishers, web_server.cpp) are excluded so
; `pio test -e native` keeps working as those files are added in later tasks.
build_src_filter =
    -<*>
    +<config.cpp>
    +<influx_format.cpp>
    +<mqtt_format.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
