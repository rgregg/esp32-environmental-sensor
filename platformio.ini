[platformio]
default_envs = esp32-poe-iso

[env:esp32-poe-iso]
; Pinned to the pioarduino platform for arduino-esp32 core 3.x (ESP-IDF 5.x),
; per the design. The official PlatformIO espressif32 platform is stuck on
; core 2.0.17 (ESP-IDF 4.4); bare `platform = espressif32` is ambiguous between
; the two installed platforms. This pin makes the core-3.x build reproducible.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-poe-iso
framework = arduino
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=1
; Re-enable the ESP32's hardware atomic instructions (S32C1I). The pioarduino
; framework default adds -mdisable-hardware-atomics, which makes GCC emit external
; __atomic_*_{1,2,4} calls; the classic-esp32 precompiled libs don't provide those
; sub-8-byte software atomics (only s2/s3/c3 do), so C++ std::shared_ptr refcounting
; (pulled in via NetworkClient/PubSubClient) fails to link. This board is a dual-core
; ESP32 without PSRAM, where hardware atomics are correct and are ESP-IDF's default,
; so stripping the flag is the right fix (no hand-rolled atomics shim needed).
build_unflags =
    -mdisable-hardware-atomics
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
    adafruit/Adafruit BME280 Library@^2.2.4
    adafruit/Adafruit CCS811 Library@^1.1.3
    knolleary/PubSubClient@^2.8
    ESP32Async/ESPAsyncWebServer@^3.6.0
    ESP32Async/AsyncTCP@^3.3.2

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=gnu++17
    -I include
    -DUNITY_INCLUDE_DOUBLE
    -DNATIVE_BUILD
; Only the framework-agnostic sources compile on the host. Arduino-only
; sources (net.cpp, sensors, publishers, web_server.cpp) are excluded so
; `pio test -e native` keeps working as those files are added in later tasks.
build_src_filter =
    -<*>
    +<config.cpp>
    +<influx_format.cpp>
    +<mqtt_format.cpp>
    +<html_escape.cpp>
    +<csrf.cpp>
    +<secure_compare.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.1.0
